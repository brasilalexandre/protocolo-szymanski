<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5ec8ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Gincana da Princesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="hud" class="hud" aria-label="Placar dos jogadores"></header>

    <main class="board-wrap">
      <canvas id="board" aria-label="Tabuleiro"></canvas>
    </main>

    <div id="msg" class="msg" role="status">Bem-vindos à Gincana!</div>

    <footer class="controls">
      <div id="dice" class="dice" aria-label="Dado">🎲</div>
      <button id="roll" class="btn big" disabled>🎲 Rolar o dado</button>
    </footer>
  </div>

  <div id="overlay" class="overlay hidden">
    <div id="modal" class="modal"></div>
  </div>

  <script src="js/minigames.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
